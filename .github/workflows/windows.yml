name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*', '!v1.7.0-beta.*']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -Test
      - name: Render interface smoke test
        shell: pwsh
        run: |
          $testData = Join-Path $env:RUNNER_TEMP 'nexus-smoke'
          New-Item -ItemType Directory -Path $testData -Force | Out-Null
          $fixtureExe = (Resolve-Path ./dist/Nexus/Nexus.exe).Path
          $platforms = @('PlayStation 4','PlayStation 3','PlayStation 2','PlayStation','PSP','Xbox','Xbox 360','Xbox One','Nintendo Switch','Nintendo 64','GameCube','Wii','Wii U','Super Nintendo','Game Boy','Game Boy Advance','Nintendo DS','Dreamcast','Outras')
          $fixtures = foreach ($platform in $platforms) { @{Id=[guid]::NewGuid().ToString('N');Name="Fixture $platform";Executable=$fixtureExe;Platform=$platform;ConfigurationExecutable=$(if ($platform -eq 'PlayStation 4') {$fixtureExe} else {$null})} }
          @{Version=1;Games=@($fixtures);OnlineArtwork=$false} | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $testData 'library.json') -Encoding utf8
          $image = Join-Path $env:RUNNER_TEMP 'nexus-preview.png'
          foreach ($viewCase in @(@('grid',140),@('grid',340),@('list',48),@('list',132))) {
            $process = Start-Process ./dist/Nexus/Nexus.exe -ArgumentList @('--data-dir', "`"$testData`"", '--smoke-test', "`"$image`"", '--preview-view', $viewCase[0], '--preview-size', $viewCase[1]) -Wait -PassThru -WindowStyle Hidden
            if ($process.ExitCode -ne 0 -or !(Test-Path $image)) { throw 'Interface smoke test failed' }
          }
          $catalog = Start-Process ./dist/Nexus/Nexus.exe -ArgumentList @('--data-dir', "`"$testData`"", '--smoke-test', "`"$image`"", '--catalog-smoke') -Wait -PassThru -WindowStyle Hidden
          if ($catalog.ExitCode -ne 0 -or !(Test-Path $image)) { throw 'Catalog smoke test failed' }
          foreach ($mode in @('--updates-smoke','--package-smoke')) {
            $extra = Start-Process ./dist/Nexus/Nexus.exe -ArgumentList @('--data-dir', "`"$testData`"", '--smoke-test', "`"$image`"", $mode) -Wait -PassThru -WindowStyle Hidden
            if ($extra.ExitCode -ne 0 -or !(Test-Path $image)) { throw "Installer/update interface smoke failed: $mode" }
          }
          $content = Start-Process ./dist/Nexus/Nexus.exe -ArgumentList @('--data-dir', "`"$testData`"", '--smoke-test', "`"$image`"", '--content-smoke') -Wait -PassThru -WindowStyle Hidden
          if ($content.ExitCode -ne 0 -or !(Test-Path $image)) { throw 'Content setup smoke test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Nexus-Ports-PC-Windows-x64
          path: dist/Nexus-Ports-PC-Windows-x64.zip
          if-no-files-found: error
